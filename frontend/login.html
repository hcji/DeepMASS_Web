<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - DeepMASS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="libs/bootstrap-5.3.0.min.css" rel="stylesheet">
  <script src="libs/bootstrap-5.3.0.bundle.min.js"></script>
  <style>
    body { background:#f5f6f8; }
    .card { max-width:420px; margin:10vh auto; border-radius:16px; }
  </style>
</head>
<body>
<div class="card shadow-sm">
  <div class="card-body">
    <h4 class="mb-3">Login to DeepMASS</h4>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input id="contact" type="text" class="form-control" placeholder="Enter your email">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" placeholder="Enter your password">
    </div>
    <button id="btnLogin" class="btn btn-primary w-100">Login</button>
    <div class="mt-3 text-center">
      <a href="register.html">Don’t have an account? Register here</a>
    </div>
    <div id="msg" class="text-danger small mt-3" style="min-height:1.2em"></div>
  </div>
</div>

<script>
  const API_BASE = 'http://deepmass.cn:8000';
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('msg');

  function getNextUrl() {
    const u = new URL(location.href);
    return u.searchParams.get('next') || 'index.html';
  }

  btn.addEventListener('click', async () => {
    msg.textContent = '';
    const contact = document.getElementById('contact').value.trim();
    const pwd = document.getElementById('password').value;

    if (!contact || !pwd) {
      msg.textContent = 'Please enter your account and password';
      return;
    }

    const form = new FormData();
    form.append('contact_info', contact);
    form.append('password', pwd);

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        body: form,
        credentials: 'include'
      });
      const data = await res.json();
      if (res.ok && data.status === 'success') {
        // Success: redirect to next
        location.href = getNextUrl();
      } else {
        msg.textContent = data?.detail || data?.message || 'Login failed';
      }
    } catch (e) {
      msg.textContent = e.message || 'Network error';
    }
  });

  // Auto-redirect if already logged in
  (async function bootstrap(){
    try {
      const res = await fetch(`${API_BASE}/auth/me`, {credentials:'include'});
      if (res.ok) location.href = getNextUrl();
    } catch {}
  })();
</script>
</body>
</html>
